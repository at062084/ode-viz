# Datasets configuration using named connectors
# Connectors define HOW to download data (see connectors.yml)
# This file defines WHAT data to download

AMS:
  description: 'Employment market data by AMS (Public Employment Service Austria)'
  connector: 'httpCsvDirect'
  base_url: 'https://arbeitsmarktdatenbank.at/opendata'
  datasets:
    - id: 'LZBL_Gesamtuebersicht_RGS_Bundesland.csv'
      description: 'Leistungsbezieher Gesamtuebersicht by RGS and Bundesland'
    - id: 'Gesamtuebersicht_AL_RGS.csv'
      description: 'Total overview of unemployment'
    - id: 'AL_Ausbildung_RGS.csv'
      description: 'Unemployment by Ausbildung and municipalities'
    - id: 'AL_Nationalitaet_RGS_Bundesland.csv'
      description: 'Unemployment by nationality'
    - id: 'AL_SC_Geschlecht_Bdl_ZR.csv'
      description: 'Unemployment by gender'
    - id: 'AL_Personenmerkmale_RGS.csv'
      description: 'Unemployment by personal characteristics'
    - id: 'AL_NACE_RGS.csv'
      description: 'Unemployment by NACE classification'
    - id: 'AL_Berufe_Nationalitaet_RGS.csv'
      description: 'Unemployment by profession and nationality'
    - id: 'AL_Berufswunsch_Nationalitaet_RGS.csv'
      description: 'Unemployment by desired profession'
    - id: 'AL_Nationalitaet_RGS.csv'
      description: 'Unemployment by nationality'
    - id: 'AL_SC_Geschlecht_Gemeinden.csv'
      description: 'Unemployment by gender and municipalities'
    - id: 'Bestand_Tagsatz_LB_Leistungsart_RGS.csv'
      description: 'Stock of daily benefit rates by benefit type'
    - id: 'Bestand_Tagsatz_LB_Personenmerkmale_RGS.csv'
      description: 'Stock of daily benefit rates by personal characteristics'
    - id: 'Bestand_AL_Geschlecht_Altersgruppen_VMD_RGS.csv'
      description: 'Unemployment stock by gender and age groups'
    - id: 'Bestand_SC_Alter_Berufswunsch_RGS.csv'
      description: 'Job seekers stock by age and desired profession'
    - id: 'Bestand_LS_OL_Verf_Berufe_RGS.csv'
      description: 'Stock of apprentices and open positions by profession'
    - id: 'OS_Ausbildung_RGS.csv'
      description: 'Open positions by education level'
    - id: 'OS_BeschArt_Arbeitszeit_RGS.csv'
      description: 'Open positions by employment type and working time'
    - id: 'OS_Berufs4Steller_RGS.csv'
      description: 'Open positions by 4-digit profession code'
    - id: 'OS_NACE_RGS.csv'
      description: 'Open positions by NACE economic classification'
    - id: 'Anzahl_Bescheiderteilungen_Bescheidleistungsart_RGS.csv'
      description: 'Number of benefit decisions by type'
    - id: 'Abgang_AL_Geschlecht_Altersgruppen_VWD_RGS.csv'
      description: 'Unemployment exit by gender and age groups'
    - id: 'UB_AL_ALQ_OS.csv'
      description: 'District overview - unemployment and unemployment rate'
    - id: 'gef_Personen_Massnahmen_RGS_Bundesland.csv'
      description: 'gef_Personen_Massnahmen_RGS_Bundesland'

MA23:
  description: 'City planning and statistics data by MA23 (Vienna City Planning)'
  connector: 'httpCsvRedirectDescription'
  base_url: 'https://www.wien.gv.at/gogv/'
  datasets:
    - id: 'l9ogdviezbzpopsexagr3stkcobgeoat32008f'
      description: 'Population by sex and age groups 2008'
    - id: 'l9ogdviezbzpopsexnatgeo2mig2007f'
      description: 'Population by nationality and migration background 2007'
    - id: 'l9ogdviebeztecsexvehkw2011f'
      description: 'Vehicles by district and type 2011'
    - id: 'l9ogdviebeztecsexvehbrd2011f'
      description: 'Vehicles by district and brand 2011'